[phases.setup]
# FFmpeg is provided by the npm dependencies; only curl is needed to fetch yt-dlp.
nixPkgs = ["...", "curl"]

[phases.install]
cmds = [
  "...",
  "mkdir -p /app/bin && curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /app/bin/yt-dlp && chmod 755 /app/bin/yt-dlp"
]
